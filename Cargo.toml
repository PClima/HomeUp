[package]
name = "homeup"
version = "0.1.0"
edition = "2024"
description = "HomeUp — modelador 3D"
authors = ["Pedro Cordeiro Lima"]

[dependencies]
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
earcutr = "0.5.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
epaint_default_fonts = "0.37.0"
flate2 = "1.1"
glam = { version = "0.34.1", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "hdr", "exr"] }
libloading = "0.9.0"
png = "0.18.1"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stl_io = "0.11.0"
tobj = "4.0.5"
ttf-parser = "0.25.1"
ureq = "3.5.0"
zip = "9.0.5"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
